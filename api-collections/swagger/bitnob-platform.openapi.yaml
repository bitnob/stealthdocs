  /policies:
    get:
      description: |-
        Returns a paginated list of policies for the organization. Quorum policies are excluded and available via GET /v1/policies/quorum. Supports cursor-based pagination and filters for status and name search.

        **Pagination**: Uses opaque cursor pagination. The cursor is base64-encoded and opaque — do not construct or inspect it. On the first request omit `cursor` / `starting_after`. When `has_more` is true, pass the `next_cursor` value from the response as `starting_after` on the next request. Continue until `has_more` is false.

        **`limit`**: Page size (default 20, max 100). Capped at the server maximum silently.

        **`has_more`**: True when more results exist after this page; call again with the cursor from the response.
      operationId: getPolicies
      parameters:
      - description: API version (defaults to the latest supported version if omitted).
        in: header
        name: API-Version
        required: false
        schema:
          default: v1
          enum:
          - v1
          type: string
      - description: Opaque cursor; returns the page after this item.
        in: query
        name: starting_after
        required: false
        schema:
          type: string
      - description: Opaque cursor; returns the page before this item.
        in: query
        name: ending_before
        required: false
        schema:
          type: string
      - description: Page size; bounded by the endpoint maximum.
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: 'Filter by lifecycle status: draft, enforced, or archived.'
        in: query
        name: status
        required: false
        schema:
          enum:
          - draft
          - enforced
          - archived
          type: string
      - description: Search policies by name (case-insensitive prefix/contains match).
