          type: string
        fee_amount:
          description: Estimated network fee as a human-readable decimal in the fee asset's display unit
          example: '0.0012'
          type: string
        fee_amount_raw:
          description: Estimated network fee as an integer in the fee asset's smallest base unit
          example: '1200000000000000'
          type: string
        fee_asset:
          description: Symbol of the asset fees are denominated in (usually the chain's native coin)
