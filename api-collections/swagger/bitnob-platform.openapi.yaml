        name: search
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - category: approvals
                  created_at: '2026-05-16T10:30:00Z'
                  created_by: 3f1a2b3c-4d5e-6f7a-8b9c-0d1e2f3a4b5c
                  created_by_name: Jane Doe
                  description: Require approval for transfers above $10k
