  /sponsored-transfers/{id}/submit:
    post:
      description: |-
        Submits the end-user's signature over the quote's `sign` payload. Provide the field that matches the quote's `sign.scheme`:
        - Solana (`solana_ed25519`): `signature`, the base58 ed25519 signature of `sign.message_base64`.
        - EVM (`evm_7702`): `signatures.authorization` and `signatures.witness`, each a 0x-prefixed 65-byte secp256k1 signature.
        - Tron (`tron_router`): `tron_signature`, a 0x-prefixed 65-byte secp256k1 signature of `sign.digest`. If the quote's `sign.approve.needed` is true (a first-time sender), you must ALSO send `tron_approve_signature`, the signature of `sign.approve.digest`, in this same call. Submitting only `tron_signature` when the approve is required is rejected.

        Bitnob verifies that the signatures recover to the sender, attaches its operator signature, freezes the fully-signed transaction, and queues it for broadcast. It returns 202 with the transfer advanced toward `pending`. Poll `GET /sponsored-transfers/{id}` (or await a webhook) for the on-chain result. A signature that does not verify returns 422 (`signature_invalid`) and leaves the quote valid, so you can re-sign and resubmit. Requires the Idempotency-Key header.
      operationId: postSponsored-transfersByIdSubmit
      parameters:
      - description: Sponsored-transfer ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: API version (defaults to the latest supported version if omitted).
        in: header
        name: API-Version
        required: false
        schema:
          default: v1
          enum:
          - v1
          type: string
      - description: Unique key (1-255 printable ASCII chars) used to safely retry write operations. Same key + body returns the cached response; same key + different body returns 409.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 255
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSponsoredTransferRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              example:
                fee:
                  amount: '0.02'
                  asset: USDC
                  usd: '0.02'
                object: sponsored_transfer
                partner_fee:
                  address: 9xQe...partner
                  amount: '0.20'
                  asset: USDC
                  usd: '0.20'
                recipient_amount: '10.50'
                sign:
                  scheme: solana_ed25519
                status: quoted
                total_debit: '10.72'
              schema:
                $ref: '#/components/schemas/SponsoredTransferResponse'
          description: Success
          headers:
            Idempotent-Replayed:
              description: True when this response was replayed from an earlier request with the same Idempotency-Key.
              schema:
                type: boolean
            X-RateLimit-Limit:
              description: Requests permitted in the current window.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Unix time (seconds) at which the rate-limit window resets.
              schema:
                type: integer
            X-RateLimit-Scope:
              description: Scope the rate limit was applied at.
              schema:
                type: string
            X-Request-Id:
              description: Unique id for this request; quote it in support requests.
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Insufficient permissions
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The quote expired before submit (code `quote_expired`) or was already submitted (code `conflict`). Request a fresh quote.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: A signature does not verify against the quote, or a required `tron_approve_signature` is missing (code `signature_invalid`). The quote is still valid, so re-sign the `sign` payload and resubmit.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
      security:
      - ApiKeyAuth: []
      summary: Submit signature(s)
      tags:
      - Sponsored-transfers
