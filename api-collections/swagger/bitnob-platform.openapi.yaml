          description: ISO-8601 timestamp when the payload was signed
          example: '2026-05-16T10:30:00Z'
          format: date-time
          type: string
        signed_payload:
          description: The payload as signed (after any hashing)
          example: '0x9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08'
          type: string
        signed_payload_encoding:
          description: Encoding of the signed payload
          example: hexadecimal
          type: string
        v:
          description: ECDSA signature v (recovery) parameter
          example: 27
          type: integer
        wallet_id:
          description: Identifier of the wallet whose key produced the signature
          example: a1b2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
