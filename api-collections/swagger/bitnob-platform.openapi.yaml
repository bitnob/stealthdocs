        message_base64:
          description: 'Solana: base64-encoded message bytes to sign as-is with the from ed25519 key.'
          type: string
        scheme:
          description: 'Which fields are populated and how to sign: solana_ed25519, evm_7702, or tron_router.'
          example: solana_ed25519
          type: string
        signer:
          description: 'Solana: the key that must produce the signature (equals from).'
          type: string
        witness:
          additionalProperties: true
          description: 'EVM: the EIP-712 typed-data witness to sign (signTypedData).'
          type: object
      type: object
    SponsoredTransferTronApprove:
      properties:
        digest:
          description: 0x-prefixed 32-byte hash (sha256 of the approve transaction's raw data) to sign with the from key. Submit the signature as tron_approve_signature.
