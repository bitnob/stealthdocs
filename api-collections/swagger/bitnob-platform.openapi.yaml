  /policies/{id}/activate:
    post:
      description: |-
        Stages a draft policy for activation as the organization's single enforced policy. API-initiated activation ALWAYS routes through quorum — the request is never applied immediately.

        Response shapes:
        - **202 Accepted**: activation staged, awaiting quorum approval from ≥2 approvers.
        - **409 Conflict**: policy is already active.
        - **422 Unprocessable Entity**: either the org's quorum is not configured with ≥2 approvers (configure it via the UI first), or a direct-activation path was attempted (which violates the two-principal invariant and is never permitted via API key).

        The two-principal invariant: no single API key may unilaterally activate a policy. Configure your org's quorum policy with at least 2 approvers to use this endpoint.

        Tracking the outcome: there is no public approval-status endpoint. Poll `GET /v1/policies/{id}` until its `status` becomes `enforced` (approved) — it stays `draft` if the approval request expires or is rejected — or subscribe to a webhook. The returned `approval_request_id` is for correlation (dashboard/webhooks), not a pollable API resource.
      operationId: postPoliciesByIdActivate
      parameters:
      - description: Policy ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: API version (defaults to the latest supported version if omitted).
        in: header
        name: API-Version
        required: false
        schema:
          default: v1
          enum:
          - v1
          type: string
      - description: Unique key (1-255 printable ASCII chars) used to safely retry write operations. Same key + body returns the cached response; same key + different body returns 409.
        in: header
