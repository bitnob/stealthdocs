        authorization:
          additionalProperties: true
          description: 'EVM: the EIP-7702 authorization tuple (chainId, address, nonce) to sign.'
          type: object
        digest:
          description: 'Tron: 0x-prefixed 32-byte EIP-191 transfer-authorization digest. Sign with the from key and submit as tron_signature. Always present on a Tron quote.'
          type: string
        digests:
          additionalProperties: true
          description: 'EVM: raw 32-byte hashes of the authorization and witness, for hardware/non-standard signers.'
