          description: 'EVM (scheme evm_7702): the authorization + witness signatures.'
        tron_approve_signature:
          description: 'Tron (scheme tron_router): the sender''s signature of sign.approve.digest. Required, and only, when the quote returns sign.approve.needed = true (a first-time sender). Submit it together with tron_signature.'
