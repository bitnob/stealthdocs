    RiskProfileRule:
      properties:
        categories:
          description: Risk categories this rule matches, from the KYT category catalogue (see GET /kyt/categories).
          example: '["sanctions"]'
          items:
            enum:
            - sanctions
            - sanctioned_jurisdiction
            - eu_sanctions
            - terrorist_financing
            - child_abuse_material
            - darknet_market
            - stolen_funds
            - ransomware
            - mixing
            - illicit_actor
            type: string
          minItems: 1
          type: array
        direction:
          description: Restricts the rule to incoming or outgoing transfers. Omit, or use "any", for no direction constraint.
          enum:
          - any
          - incoming
          - outgoing
          example: outgoing
          type: string
        exposure_type:
          description: Restricts the rule to direct or indirect exposure. Omit, or use "any", for no exposure constraint.
          enum:
          - direct
          - indirect
          - any
          example: direct
          type: string
        level_actions:
          $ref: '#/components/schemas/LevelActions'
          description: Per-level action override for alerts this rule matches. At least one level must be set; any level left unset falls through to the profile catch-all.
        max_exposure_usd:
          description: Inclusive upper bound (USD) on alert exposure for the rule to match, as a decimal string; an alert at exactly this amount matches. Omit for no maximum.
          example: '5000'
          type: string
        min_exposure_usd:
          description: Inclusive lower bound (USD) on alert exposure for the rule to match, as a decimal string; an alert at exactly this amount matches. Omit for no minimum.
          example: '1000'
