          type: string
        description:
          description: Optional free-text summary of the rule's intent.
          type: string
        id:
          description: Unique identifier of the rule.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          type: string
        name:
          description: Human-readable name of the rule.
          example: Block large transfers
          type: string
        object:
          description: Object type discriminator; always "rule".
          example: rule
          type: string
        order:
          description: Position of the rule in the policy's first-match-wins evaluation order.
          example: 1
          type: integer
        priority:
          description: Evaluation priority of the rule.
          example: 50
          type: integer
        updated_at:
          description: Timestamp when the rule was last updated.
          example: '2026-05-16T10:30:00Z'
          format: date-time
          type: string
      type: object
    PublicRuleTraceEntry:
      properties:
        action:
