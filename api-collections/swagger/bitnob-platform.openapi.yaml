        id:
          description: Unique identifier of the subscription.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
          type: string
        label:
          description: Optional partner-facing label.
          example: Customer deposit monitor
          type: string
        last_event_at:
          description: ISO-8601 time of the most recent delivered event.
          format: date-time
          type: string
        metadata:
          additionalProperties: true
          description: Arbitrary partner-supplied key/value metadata.
          type: object
        network:
          description: Network the address is on.
          example: mainnet
          type: string
        object:
          description: Object type discriminator; always "subscription".
          example: subscription
          type: string
        signing_secret:
          description: Plaintext HMAC signing secret. Returned ONLY on create and rotate-secret — never on GET/list.
          type: string
        status:
          description: Current status of the subscription.
          example: active
          type: string
        updated_at:
          description: ISO-8601 time when the subscription was last updated.
          example: '2026-05-16T10:30:00Z'
          format: date-time
          type: string
        webhook_url:
          description: URL on-chain events are delivered to.
          example: https://example.com/webhooks/bitnob
          type: string
      type: object
    TransactionInput:
      properties:
        txid:
          description: Transaction hash of the output to spend
          example: de64fb866d99a42d857698ec5c383c9eb8f8a9d2596fdf556a8bba95a5bcc070
          maxLength: 64
          minLength: 64
          type: string
        vout:
          description: Output index within that transaction
          example: '0'
          type: string
      required:
      - txid
      type: object
    TransactionResponse:
      properties:
        amount:
          description: Transferred amount as a human-readable decimal in the asset's display unit
          example: '25.5'
          type: string
        amount_raw:
          description: Transferred amount as an integer in the asset's smallest base unit
          example: '25500000'
          type: string
        asset:
          description: Symbol of the transferred asset
          example: USDC
          type: string
        asset_decimals:
          description: Number of decimals used to convert the asset's base units to its display unit
          example: 6
          type: integer
        block_hash:
          description: Hash of the block the transaction was included in
          example: '0x8f4c1b8e2a7d3f06c5b1a09e8d7c6f5e4d3c2b1a09f8e7d6c5b4a3928170615f'
          type: string
        block_number:
          description: Number of the block the transaction was included in
          example: 21345678
          type: integer
        broadcast_at:
          description: ISO-8601 timestamp when the transaction was broadcast to the network
          example: '2026-05-16T10:30:02Z'
          format: date-time
          type: string
        chain:
          description: Blockchain the transaction was made on
          example: ethereum
          type: string
        completed_at:
          description: ISO-8601 timestamp when the transaction reached a completed state
          example: '2026-05-16T10:30:45Z'
          format: date-time
          type: string
        confirmations:
          description: Number of block confirmations for the transaction
          example: 12
          type: integer
        created_at:
          description: ISO-8601 timestamp when the transaction was created
          example: '2026-05-16T10:30:00Z'
