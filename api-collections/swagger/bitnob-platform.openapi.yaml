          type: string
        conditions:
          description: Conditions that must all match for the rule to apply.
          items:
            $ref: '#/components/schemas/PublicConditionResponse'
          type: array
        created_at:
          description: Timestamp when the rule was created.
          example: '2026-05-16T10:30:00Z'
