        status:
          description: 'Lifecycle state. Non-terminal: pending_signature, pending_authorization, delayed, signed, awaiting_sponsorship, broadcasting, confirming, pending_screening. Terminal: completed, failed, cancelled, rejected. Poll this endpoint until a terminal state; an empty tx_hash means it has not been broadcast yet.'
          enum:
