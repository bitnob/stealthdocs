      tags:
      - Sponsored-transfers
    post:
      description: |-
        Quotes a gas-sponsored transfer for an external end-user (someone who holds their own key and has no Bitnob wallet) and returns the exact payload they must sign. Bitnob pays the network gas and recoups it as a fee in the transferred token, so neither party needs to hold the native gas asset (SOL, ETH, or TRX).

        Amounts. `amount` is a decimal string in the asset's normal units (for example `"10.50"` USDC). By default (net mode) `amount` is what the recipient receives and the sender (`from`) is debited `total_debit`, which is `recipient_amount` plus `fee` (the sponsorship fee) plus `partner_fee` (your optional markup). Set `treat_as_gross_amount: true` for gross mode: `amount` becomes the sender's total debit (`total_debit` equals `amount`) and the sponsorship and partner fees are deducted from it, so `recipient_amount` is `amount` minus those fees. Gross mode lets you sweep a full source balance without overdrawing it; the request is rejected (`invalid_request`) when `amount` does not exceed the fees. The response echoes `treat_as_gross_amount` and both `recipient_amount` and `total_debit` so you can confirm the split.

        Flow. First call create (this endpoint) to get a `sign` block and an `expires_at`. Then have the end-user sign it verbatim with their own key. Then submit the signature or signatures to `POST /sponsored-transfers/{id}/submit`. Finally poll `GET /sponsored-transfers/{id}` (or subscribe to `sponsored_transfer.*` webhooks) until the status is terminal. Sign and submit before `expires_at`.

        What to sign depends on `sign.scheme`:
        - `solana_ed25519`: sign the raw message bytes in `sign.message_base64` with the `from` ed25519 key, then submit the base58 signature as `signature`.
        - `evm_7702`: sign both the EIP-7702 authorization (`sign.authorization`) and the EIP-712 witness (`sign.witness`) with the `from` key, then submit both as 0x-prefixed 65-byte signatures. `sign.digests` gives the raw 32-byte hashes if you use a non-standard signer.
        - `tron_router`: sign the 0x-prefixed 32-byte digest in `sign.digest` with the `from` secp256k1 key and submit it as `tron_signature`. Important: on a sender's first sponsored transfer of a given token, the quote also returns a `sign.approve` block with `sign.approve.needed` set to true. When that block is present you must ALSO sign `sign.approve.digest` with the same `from` key and submit it as `tron_approve_signature` in the same submit call, alongside `tron_signature`. This one-time approval is what lets the router pull the tokens on the sender's behalf, and the transfer cannot be broadcast without it. It is needed only on the first transfer (later transfers do not return the block and need only `tron_signature`), the single quoted fee already covers its cost, and Bitnob activates the sender's account first if it is brand new.

        Partner markup (optional). Include `partner_fee` to charge your own flat fee (in the same asset) to an address you control, on top of the sponsorship fee. `address` and `amount` are required together, the address must not equal the sender or recipient, and the amount is capped per chain. Supported on Solana, EVM, and Tron. Requires the Idempotency-Key header.
      operationId: postSponsored-transfers
      parameters:
      - description: API version (defaults to the latest supported version if omitted).
        in: header
        name: API-Version
        required: false
        schema:
          default: v1
          enum:
          - v1
          type: string
      - description: Unique key (1-255 printable ASCII chars) used to safely retry write operations. Same key + body returns the cached response; same key + different body returns 409.
        in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 255
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSponsoredTransferRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              example:
                fee:
                  amount: '0.02'
                  asset: USDC
                  usd: '0.02'
                object: sponsored_transfer
                partner_fee:
                  address: 9xQe...partner
                  amount: '0.20'
                  asset: USDC
                  usd: '0.20'
                recipient_amount: '10.50'
                sign:
                  scheme: solana_ed25519
                status: quoted
                total_debit: '10.72'
              schema:
                $ref: '#/components/schemas/SponsoredTransferResponse'
          description: Created
          headers:
            Idempotent-Replayed:
              description: True when this response was replayed from an earlier request with the same Idempotency-Key.
              schema:
                type: boolean
            X-RateLimit-Limit:
              description: Requests permitted in the current window.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Unix time (seconds) at which the rate-limit window resets.
              schema:
                type: integer
            X-RateLimit-Scope:
              description: Scope the rate limit was applied at.
              schema:
                type: string
            X-Request-Id:
              description: Unique id for this request; quote it in support requests.
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Invalid request: an unsupported chain, asset, or network, a malformed address or amount, a `treat_as_gross_amount` that does not exceed the sponsorship and partner fees, or an invalid `partner_fee` (code `invalid_request`), or a markup above the per-chain cap (code `partner_fee_too_high`).'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication required
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Insufficient permissions
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Quote rate limit hit (code `rate_limited`) or the organization's daily sponsored-gas budget exceeded (code `budget_exceeded`). Honour the `Retry-After` header.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sponsorship capacity temporarily unavailable (code `capacity_unavailable`). Retry shortly.
      security:
      - ApiKeyAuth: []
      summary: Create sponsored transfer (quote)
      tags:
      - Sponsored-transfers
  /sponsored-transfers/{id}:
    get:
      description: 'Returns a single sponsored transfer by id, including its current `status`, the fee breakdown, and, once broadcast, its `tx_hash` and confirmations. On a `failed` transfer, `failure_code` and `failure_reason` explain why. Status lifecycle: `quoted`, then `validating`, then `submitted`, then a chain-specific onboarding step (EVM returns `assembled`; a first-time Tron sender passes through `tron_activating` and/or `tron_approving` while Bitnob activates the account and broadcasts the one-time approval), then `pending`, then `completed`. Terminal failure states are `failed`, `expired`, and `cancelled`.'
      operationId: getSponsored-transfersById
      parameters:
      - description: Sponsored-transfer ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      - description: API version (defaults to the latest supported version if omitted).
        in: header
        name: API-Version
        required: false
        schema:
          default: v1
          enum:
          - v1
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                fee:
                  amount: '0.02'
                  asset: USDC
                  usd: '0.02'
                object: sponsored_transfer
                partner_fee:
                  address: 9xQe...partner
                  amount: '0.20'
                  asset: USDC
                  usd: '0.20'
                recipient_amount: '10.50'
                sign:
                  scheme: solana_ed25519
                status: quoted
                total_debit: '10.72'
              schema:
                $ref: '#/components/schemas/SponsoredTransferResponse'
          description: Success
          headers:
            X-RateLimit-Limit:
              description: Requests permitted in the current window.
              schema:
